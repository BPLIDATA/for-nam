<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สุขสันต์วันเกิดนะที่รัก</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--ink:#ffe3f1;--pink:#ff6ec4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Mali','Noto Sans Thai',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--ink);text-align:center;cursor:pointer;transition:opacity .9s;z-index:2}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:clamp(28px,8vw,44px);font-weight:600;color:var(--pink);text-shadow:0 0 12px var(--pink),0 0 32px #c2188a}
#intro p{margin:0;font-size:18px;opacity:.8}
#heart{width:84px;height:84px;filter:drop-shadow(0 0 14px #ff3d7f);animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:#ffd0e6;font-size:16px;line-height:1.5;opacity:0;pointer-events:none;text-shadow:0 0 8px #000}
.go #hint{animation:hint 8s forwards}
@keyframes hint{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#00000088;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;z-index:1;cursor:pointer}
.go #snd{display:flex}
#envw{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .4s;z-index:3;color:#ffd0e6;cursor:pointer}
#envw.show{opacity:1;pointer-events:auto}
#envw p{margin:0;font-size:16px;opacity:.7}
.env{--w:min(80vw,340px);position:relative;width:var(--w);height:calc(var(--w)*.64);perspective:900px;margin-top:90px;transform:scale(.9);transition:transform .6s}
#envw.show .env{transform:scale(1)}
.back{position:absolute;inset:0;background:#c43b86;border-radius:8px}
.card{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:linear-gradient(#fff,#ffe3f0);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#b3195c;font-size:clamp(20px,6vw,26px);line-height:1.35;font-weight:600;z-index:2;box-shadow:0 0 26px rgba(255,110,196,.65);transition:transform 1s .7s cubic-bezier(.2,.8,.2,1)}
.opened .card{transform:translateY(-95%)}
.front{position:absolute;inset:0;background:#e0509a;border-radius:8px;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:3}
.flap{position:absolute;left:0;top:0;width:100%;height:54%;background:#a82870;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .6s ease,z-index 0s .3s}
.flap::after{content:"💗";position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:26px}
.opened .flap{transform:rotateX(180deg);z-index:1}
#end{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#2a0a22,#000 70%);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:3;text-align:center;color:#ffd0e6}
#end.show{opacity:1;pointer-events:auto}
#msgs{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 40%,#2a0a22,#000 70%);opacity:0;pointer-events:none;transition:opacity .8s;z-index:3;text-align:center;cursor:pointer}
#msgs.show{opacity:1;pointer-events:auto}
#mbox{max-width:520px;transition:opacity .8s}
#mbox.out{opacity:0}
.ml{margin:0 0 22px;font-size:clamp(19px,5.4vw,25px);line-height:1.65;font-weight:600;color:#ffe3f1;text-shadow:0 0 4px currentColor,0 0 12px currentColor,0 0 28px currentColor;opacity:0;transform:translateY(110px);transition:opacity 2s,transform 2.4s ease-out;animation:hue 8s linear infinite}
@keyframes drift{from{transform:translateY(50px)}to{transform:translateY(-50px)}}
.ml:first-child{font-size:clamp(24px,7vw,32px)}
.ml.in{opacity:1;transform:none}
.pols{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.pol{width:min(30vw,130px);background:#fff;padding:6px 6px 22px;margin:0 -8px;box-shadow:0 0 24px #ff6ec4aa;opacity:0;transform:rotate(var(--r)) translateY(40px);transition:opacity 1s,transform 1s}
.pol:nth-child(2){z-index:1;margin-top:-26px}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
#end.show .pol{opacity:1;transform:rotate(var(--r))}
#end.show .pol:nth-child(1){transition-delay:.5s}#end.show .pol:nth-child(2){transition-delay:1s}#end.show .pol:nth-child(3){transition-delay:1.5s}
#end h2{margin:0;font-size:clamp(28px,8.5vw,42px);font-weight:600;color:#ff6ec4;text-shadow:0 0 12px #ff6ec4,0 0 32px #c2188a;animation:hue 6s linear infinite}
#end p{margin:0;font-size:20px}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#again{margin-top:10px;padding:10px 26px;border-radius:99px;border:1px solid #ff6ec4;background:transparent;color:#ffd0e6;font:inherit;font-size:16px;cursor:pointer}
.hr{position:absolute;bottom:-8vh;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){#heart{animation:none}.card,.flap,.env{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ลากนิ้วเพื่อหมุนมุมกล้อง</div>
<button id="snd" aria-label="เปิดหรือปิดเสียงเพลง">🔊</button>
<div id="envw"><div class="env" id="env"><div class="back"></div><div class="card"><span>แฮปปีเบิร์ทเดย์<br>น้ำสุดที่รัก</span></div><div class="front"></div><div class="flap"></div></div><p>แตะเพื่อปิด</p></div>
<div id="msgs"><div id="mbox"></div></div>
<div id="end"><div class="pols"><div class="pol" style="--r:-9deg"><img alt=""></div><div class="pol" style="--r:0deg"><img alt=""></div><div class="pol" style="--r:9deg"><img alt=""></div></div><h2>แฮปปีเบิร์ทเดย์น้ำ</h2><p>รักน้ำที่สุดเลยนะ 💗</p><button id="again">ดูอีกครั้ง</button></div>
<div id="intro" role="button" tabindex="0" aria-label="แตะเพื่อเปิดอ่าน">
  <svg id="heart" viewBox="0 0 32 29"><path fill="#ff3d7f" d="M16 28C-6 13 4-3 16 6 28-3 38 13 16 28z"/></svg>
  <h1>สุขสันต์วันเกิดนะที่รัก</h1>

</div>

        ctx.strokeStyle='hsla('+bh+',100%,65%,'+(.5*f)+')';ctx.beginPath();
        for(var x=-bs;x<bs;x+=bs*.16){ctx.moveTo(x,-bs);ctx.lineTo(x,bs)}
        ctx.stroke();ctx.restore();
      }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  /* drag to rotate camera, tap a big message to open the envelope */
  var px=0,py=0,sx0=0,sy0=0,moved=false;
  cv.addEventListener('pointerdown',function(e){down=true;moved=false;px=sx0=e.clientX;py=sy0=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',function(e){
    if(!down)return;
    yawU=Math.max(-.9,Math.min(.9,yawU+(e.clientX-px)*.005));
    pitU=Math.max(-.6,Math.min(.6,pitU+(e.clientY-py)*.004));
    px=e.clientX;py=e.clientY;
    if(Math.abs(e.clientX-sx0)+Math.abs(e.clientY-sy0)>10)moved=true;
  });
  cv.addEventListener('pointerup',function(e){
    down=false;if(moved||!started)return;
    for(var n=hits.length-1;n>=0;n--){
      var h=hits[n],dx=e.clientX-h.x,dy=e.clientY-h.y,ca=Math.cos(h.a),sa=Math.sin(h.a);
      var lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca;
      if(Math.abs(lx)<h.w/2+26&&Math.abs(ly)<h.h*.7+26){openEnv();return}
    }
  });
  cv.addEventListener('pointercancel',function(){down=false});
  var envw=document.getElementById('envw');
  function openEnv(){envw.classList.add('show');setTimeout(function(){envw.classList.add('opened')},450)}
  var endEl=document.getElementById('end');
  document.querySelectorAll('#end img').forEach(function(m,n){m.src=PH[n]});
  for(i=0;i<16;i++){var sp=document.createElement('span');sp.className='hr';sp.textContent=i%3?'💗':'❤️';sp.style.cssText='left:'+rnd(2,96)+'%;font-size:'+rnd(14,30)+'px;animation-duration:'+rnd(6,12)+'s;animation-delay:'+rnd(0,8)+'s';endEl.appendChild(sp)}
  var msgsEl=document.getElementById('msgs'),mbox=document.getElementById('mbox'),mid=0,mdone=null;
  var SETS=[["สุขสันต์วันเกิดนะคับน้ำ!","แก๊สไม่มีอะไรจะให้นอกจากความรักก้อนโต (กับความกวนประสาทที่มีให้ทุกวัน 555)","ขอให้ปีนี้สวยวันสวยคืน รวย ๆ เฮง ๆ แล้วก็ตามใจแก๊สเยอะ ๆ นะ","รักนะจุ๊บ ๆ"],["แฮปปี้เบิร์ธเดย์ครับตัวแสบของแก๊ส","แก๊สขอให้ปีนี้เป็นปีที่ดีที่สุดของน้ำเลยนะ","อยากได้อะไรเดี๋ยวจัดให้ (ถ้าตังค์ในกระเป๋าไหว 555)","รักและดูแลกันแบบนี้ไปนาน ๆ เลยนะคับ!"]];
  function finishMsgs(){var d=mdone;mdone=null;mid++;msgsEl.classList.remove('show');if(d)setTimeout(d,900)}
  function runMsgs(done){
    var my=++mid,s=0;mdone=done;msgsEl.classList.add('show');
    (function nextSet(){
      if(my!==mid)return;
      if(s>=SETS.length){finishMsgs();return}
      var lines=SETS[s++];mbox.className='';mbox.innerHTML='';var sn=s-1,shown=700+(lines.length-1)*2000+2200;mbox.style.animation='none';void mbox.offsetWidth;mbox.style.animation='drift '+((shown+3900)/1000)+'s linear forwards';
      lines.forEach(function(tx,n){var p=document.createElement('p');p.className='ml';p.textContent=tx;p.style.color='hsl('+((330+n*50+sn*90)%360)+',100%,78%)';mbox.appendChild(p);setTimeout(function(){if(my===mid)p.classList.add('in')},700+n*2000)});
      
      setTimeout(function(){if(my===mid)mbox.className='out'},shown+3000);
      setTimeout(nextSet,shown+3900);
    })();
  }
  msgsEl.addEventListener('click',finishMsgs);
  envw.addEventListener('click',function(){envw.classList.remove('show','opened');setTimeout(function(){runMsgs(function(){endEl.classList.add('show')})},500)});
  document.getElementById('again').addEventListener('click',function(){endEl.classList.remove('show');var gi=items.indexOf(gift);if(gi>=0)items.splice(gi,1);gift.fi=0;tStart=0});
  /* music: a music-box Happy Birthday made with Web Audio */
  var AC=null,master=null,muted=false,snd=document.getElementById('snd');
  var MEL=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
  function note(fr,t,d){
    var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),end=t+d*1.8+.05;
    o.frequency.value=fr;o2.frequency.value=fr*2;o2.type='triangle';g2.gain.value=.25;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.001,end-.05);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(end);o2.stop(end);
  }
  function play(){
    var t=AC.currentTime+.1,B=.62;
    MEL.forEach(function(m){note(m[0],t,m[1]*B);t+=m[1]*B});
    setTimeout(play,(t-AC.currentTime+1.5)*1000);
  }
  function startMusic(){
    try{var C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);if(AC.resume)AC.resume();play()}catch(_){snd.style.display='none'}
  }
  snd.addEventListener('click',function(){if(!AC)return;muted=!muted;master.gain.value=muted?0:.5;snd.textContent=muted?'🔇':'🔊'});
  var intro=document.getElementById('intro');
  function go(){if(started)return;started=true;intro.classList.add('hide');document.body.classList.add('go');startMusic()}
  intro.addEventListener('click',go);
  intro.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')go()});
  (document.fonts&&document.fonts.load?document.fonts.load('600 30px Mali','คิดถึง').catch(function(){}):Promise.resolve()).then(function(){requestAnimationFrame(frame)});
})();
