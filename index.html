<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำอวยพรที่พุ่งมาหาน้ำ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--ink:#ffe3f1;--pink:#ff6ec4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Mali','Noto Sans Thai',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(ellipse at 50% 24%,#7a2555 0%,#35102f 40%,#090610 100%);color:#fff;text-align:center;z-index:5;overflow:auto}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff12,transparent 42%,#ff6ec412);pointer-events:none}
#lockHead{position:relative;margin-bottom:4px}
#lockIcon{font-size:28px;line-height:1}
#lockClock{margin:8px 0 0;font-family:system-ui,sans-serif;font-size:clamp(58px,16vw,86px);font-weight:200;line-height:1;letter-spacing:-.06em}
#lockDate{margin:8px 0 0;font-size:17px;opacity:.9}
#lockTitle{margin:6px 0 0;font-size:clamp(22px,6vw,30px);color:#ffd0e6;text-shadow:0 0 14px #ff6ec477}
#unlockForm{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px;width:min(280px,82vw);margin-top:4px}
#unlockForm label{font-size:15px;opacity:.9}
#passcode{box-sizing:border-box;width:170px;padding:8px;border:0;border-bottom:1px solid #ffffff66;border-radius:0;background:transparent;color:#fff;text-align:center;font:inherit;font-size:27px;letter-spacing:.48em;outline:none}
#passcode:focus{border-color:#ffb5d8}
#keypad{display:grid;grid-template-columns:repeat(3,64px);gap:10px 16px;justify-content:center;margin-top:6px}
.key{width:64px;height:54px;border:1px solid #ffffff40;border-radius:18px;background:#ffffff12;color:#fff;font:inherit;font-family:system-ui,sans-serif;font-size:23px;cursor:pointer;backdrop-filter:blur(8px);transition:background .15s,transform .15s}
.key:active{transform:scale(.94);background:#ff6ec455}
.key.action{border:0;background:transparent;font-family:inherit;font-size:14px}
#lockError{position:relative;min-height:1.5em;margin:0;color:#ffd0e6;font-size:14px}
#lock button:focus-visible,#passcode:focus-visible{outline:2px solid #fff;outline-offset:3px}
#lock.hide{opacity:0;pointer-events:none;transition:opacity .6s}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--ink);text-align:center;cursor:pointer;transition:opacity .9s;z-index:2}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:clamp(28px,8vw,44px);font-weight:600;color:var(--pink);text-shadow:0 0 12px var(--pink),0 0 32px #c2188a}
#intro p{margin:0;font-size:18px;opacity:.8}
#heart{width:84px;height:84px;filter:drop-shadow(0 0 14px #ff3d7f);animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#flightLayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.flight-item{position:absolute;left:0;top:0;opacity:0;will-change:left,top,transform,opacity;text-align:center;filter:drop-shadow(0 0 10px #ff6ec4aa)}
.flight-photo{width:clamp(76px,13vw,132px);padding:6px 6px 18px;background:#fff8ee;border:1px solid #fff;box-shadow:0 8px 26px #0009}
.flight-photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.flight-text{max-width:min(74vw,340px);font-size:clamp(18px,4.1vw,34px);line-height:1.3;font-weight:600;color:#fff;text-shadow:0 0 7px currentColor,0 0 20px currentColor,0 0 36px currentColor}
.wave-flight{animation:converge 3.2s cubic-bezier(.18,.68,.2,1) var(--delay) both}
@keyframes converge{0%{left:var(--from-x);top:var(--from-y);transform:translate(-50%,-50%) scale(.52) rotate(var(--tilt));opacity:0}12%{opacity:1}38%{left:var(--to-x);top:var(--to-y);transform:translate(-50%,-50%) scale(1.08) rotate(0);opacity:1}88%{left:var(--to-x);top:var(--to-y);transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{left:var(--to-x);top:var(--to-y);transform:translate(-50%,-50%) scale(.96);opacity:0}}
.meteor-flight{animation:meteorFall 3.8s cubic-bezier(.18,.62,.3,1) var(--delay) both}
.meteor-flight::after{content:"♥";position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(-18deg);color:#ff9bc8;font-size:25px;text-shadow:0 0 8px #ff58bd,0 0 22px #ff58bd}
@keyframes meteorFall{0%{left:var(--meteor-x);top:-90px;transform:translate(-50%,0) scale(.55) rotate(-12deg);opacity:0}12%{opacity:1}42%{top:38%;transform:translate(-50%,0) scale(1) rotate(8deg);opacity:1}70%{left:var(--meteor-mid-x);top:47%;transform:translate(-50%,0) scale(1.04) rotate(12deg);opacity:1}84%{left:var(--meteor-mid-x);top:47%;transform:translate(-50%,0) scale(1.04) rotate(12deg);opacity:1}100%{left:calc(var(--meteor-x) + var(--meteor-dx));top:calc(100% + 100px);transform:translate(-50%,0) scale(.85) rotate(22deg);opacity:0}}
#openBirthday{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);z-index:2;opacity:0;pointer-events:none;padding:12px 22px;border:1px solid #ffd0e699;border-radius:99px;background:#180912dd;color:#ffe6f1;font:inherit;font-size:clamp(15px,3.6vw,19px);box-shadow:0 0 24px #ff6ec455;cursor:pointer;transition:opacity .5s,transform .5s}
.gift-ready #openBirthday{opacity:1;pointer-events:auto;transform:translate(-50%,0);animation:promptPulse 1.8s ease-in-out infinite alternate}
@keyframes promptPulse{to{box-shadow:0 0 34px #ff6ec4aa;filter:brightness(1.2)}}
#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:#ffd0e6;font-size:16px;line-height:1.5;opacity:0;pointer-events:none;text-shadow:0 0 8px #000}
.go #hint{animation:hint 8s forwards}
@keyframes hint{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#00000088;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;z-index:1;cursor:pointer}
.go #snd{display:flex}
#envw{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 72%,#351020bb,rgba(0,0,0,.9) 64%);opacity:0;pointer-events:none;transition:opacity .4s;z-index:3;color:#ffe8d8;cursor:pointer;overflow:hidden}
#fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.firework{position:absolute;left:var(--x);bottom:5%;width:3px;height:48px;border-radius:50%;background:linear-gradient(to top,transparent,var(--spark));box-shadow:0 0 12px var(--spark);opacity:0;animation:firework 1.8s cubic-bezier(.18,.68,.24,1) var(--delay) forwards}
.firework::before{content:"✦";position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:28px;color:var(--spark);text-shadow:0 0 10px var(--spark),0 0 25px var(--spark)}
.firework::after{content:"✧";position:absolute;left:50%;top:-18px;transform:translateX(14px);font-size:18px;color:#fff2c6;text-shadow:0 0 14px var(--spark)}
@keyframes firework{0%{transform:translateY(0) scale(.45);opacity:0}12%{opacity:1}64%{transform:translateY(-58vh) scale(1);opacity:1}78%{transform:translateY(-58vh) scale(1.35);opacity:1}100%{transform:translateY(-58vh) scale(2.5);opacity:0}}
#envHint{position:relative;margin:0;font-size:16px;opacity:.9;text-shadow:0 2px 12px #000}
#envw.show{opacity:1;pointer-events:auto}
#envw p{margin:0;font-size:16px;opacity:.7}
#envw:focus-visible,#msgs:focus-visible{outline:3px solid #ff6ec4;outline-offset:-8px}
.env{--w:min(82vw,360px);position:relative;width:var(--w);height:calc(var(--w)*.66);perspective:1100px;margin-top:34px;transform:scale(.82) translateY(30px);transition:transform .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 22px 36px #0009)}
#envw.show .env{transform:scale(1) translateY(0)}
.back{position:absolute;inset:0;background:linear-gradient(145deg,#8d315a,#5d1b3b 72%);border:1px solid #f4c88788;border-radius:14px;box-shadow:inset 0 0 0 7px #4b173455}
.back::after{content:"";position:absolute;inset:13px;border:1px solid #f6d9aa77;border-radius:8px}
.card{position:absolute;left:9%;right:9%;top:8%;bottom:8%;background:linear-gradient(145deg,#fff9ed,#f3d9c5);border:1px solid #fff;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#78344d;font-size:clamp(21px,6vw,28px);line-height:1.45;font-weight:600;z-index:2;box-shadow:0 8px 28px #1d061655;transition:transform 1s .65s cubic-bezier(.2,.8,.2,1)}
.card small{display:block;margin-top:8px;font-size:.62em;color:#a76a63;font-weight:400}
.opened .card{transform:translateY(-95%)}
.front{position:absolute;inset:0;background:linear-gradient(145deg,#ad4965,#85304f);border:1px solid #edbf8b88;border-radius:14px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3;filter:drop-shadow(0 1px 1px #2b0716)}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;background:linear-gradient(165deg,#c16a77,#8c3858);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .8s cubic-bezier(.3,.7,.2,1),z-index 0s .4s;filter:drop-shadow(0 4px 5px #390c23)}
.flap::after{content:"♥";position:absolute;left:50%;top:26%;transform:translateX(-50%);display:grid;place-items:center;width:48px;height:48px;border:3px solid #fff1d5;border-radius:50%;background:linear-gradient(145deg,#e8bd77,#b87754);color:#722c48;font-family:Georgia,serif;font-size:27px;box-shadow:0 3px 12px #320b1c88}
.opened .flap{transform:rotateX(180deg);z-index:1}
#end{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#2a0a22,#000 70%);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:3;text-align:center;color:#ffd0e6}
#end.show{opacity:1;pointer-events:auto}
#msgs{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 40%,#2a0a22,#000 70%);opacity:0;pointer-events:none;transition:opacity .8s;z-index:3;text-align:center;cursor:pointer}
#msgs.show{opacity:1;pointer-events:auto}
#mbox{max-width:520px;transition:opacity .8s}
#msgStep{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;color:#ffd0e6aa;font-size:14px;letter-spacing:.08em}
#skipMsgs{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 20px;border:1px solid #ff6ec488;border-radius:99px;background:#190914dd;color:#ffd0e6;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 0 18px #ff6ec433}
#skipMsgs:focus-visible,#snd:focus-visible,#again:focus-visible{outline:3px solid #fff;outline-offset:3px}
#mbox.out{opacity:0}
.ml{margin:0 0 22px;font-size:clamp(19px,5.4vw,25px);line-height:1.65;font-weight:600;color:#ffe3f1;text-shadow:0 0 4px currentColor,0 0 12px currentColor,0 0 28px currentColor;opacity:0;transform:translateY(110px);transition:opacity 2s,transform 2.4s ease-out;animation:hue 8s linear infinite}
@keyframes drift{from{transform:translateY(50px)}to{transform:translateY(-50px)}}
.ml:first-child{font-size:clamp(24px,7vw,32px)}
.ml.in{opacity:1;transform:none}
.pols{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.pol{width:min(30vw,130px);background:#fff;padding:6px 6px 22px;margin:0 -8px;box-shadow:0 0 24px #ff6ec4aa;opacity:0;transform:rotate(var(--r)) translateY(40px);transition:opacity 1s,transform 1s}
.pol:nth-child(2){z-index:1;margin-top:-26px}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:opacity .35s}
#end.show .pol{opacity:1;transform:rotate(var(--r))}
#end.show .pol:nth-child(1){transition-delay:.5s}#end.show .pol:nth-child(2){transition-delay:1s}#end.show .pol:nth-child(3){transition-delay:1.5s}
#end h2{margin:0;font-size:clamp(28px,8.5vw,42px);font-weight:600;color:#ff6ec4;text-shadow:0 0 12px #ff6ec4,0 0 32px #c2188a;animation:hue 6s linear infinite}
#end p{margin:0;font-size:20px}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#again{margin-top:10px;padding:10px 26px;border-radius:99px;border:1px solid #ff6ec4;background:transparent;color:#ffd0e6;font:inherit;font-size:16px;cursor:pointer}
.hr{position:absolute;bottom:-8vh;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){#heart{animation:none}.card,.flap,.env{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flightLayer" aria-hidden="true"></div>
<button id="openBirthday" type="button">💌 แตะ “สุขสันต์วันเกิด” เพื่อเปิดซอง</button>
<div id="hint">คำอวยพรกำลังพุ่งมาหาน้ำ · ลากเพื่อหมุนมุมมอง</div>
<button id="snd" aria-label="เปิดหรือปิดเสียงเพลง">🔊</button>
<div id="envw" role="button" tabindex="0" aria-label="เปิดจดหมายอวยพร"><div id="fireworks" aria-hidden="true"></div><div class="env" id="env"><div class="back"></div><div class="card"><span>สุขสันต์วันเกิด<br>น้ำสุดที่รัก<br><small>ด้วยรักจากแก๊ส</small></span></div><div class="front"></div><div class="flap"></div></div><p id="envHint">กำลังจุดพลุให้คำอวยพร…</p></div>
<div id="msgs" role="region" aria-label="ข้อความอวยพร" aria-live="polite" tabindex="0"><div id="msgStep" aria-hidden="true"></div><div id="mbox"></div><button id="skipMsgs" type="button" aria-label="ไปข้อความถัดไป">แตะเพื่ออ่านต่อ ›</button></div>
<div id="end"><div class="pols"><div class="pol" style="--r:-9deg"><img alt=""></div><div class="pol" style="--r:0deg"><img alt=""></div><div class="pol" style="--r:9deg"><img alt=""></div></div><h2>สุขสันต์วันเกิดนะน้ำ</h2><p>รักน้ำที่สุดเลยนะ 💗</p><button id="again">ดูอีกครั้ง</button></div>
<section id="lock" aria-labelledby="lockTitle"><header id="lockHead"><div id="lockIcon" aria-hidden="true">🔒</div><div id="lockClock" aria-label="เวลา">00:00</div><p id="lockDate"></p><h1 id="lockTitle">สุขสันต์วันเกิดนะที่รัก 💗</h1></header><form id="unlockForm"><label for="passcode">ป้อนรหัสเพื่อปลดล็อค</label><input id="passcode" name="passcode" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-label="รหัสปลดล็อค 4 หลัก" aria-describedby="lockError"><div id="keypad" role="group" aria-label="แป้นตัวเลข"><button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button><button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button><button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button><button class="key action" type="button" data-key="clear">ล้าง</button><button class="key" type="button" data-key="0">0</button><button class="key action" type="button" data-key="back" aria-label="ลบตัวเลขล่าสุด">⌫</button></div><p id="lockError" role="status" aria-live="polite"></p></form></section>
<div id="intro" role="button" tabindex="0" aria-label="แตะเพื่อเปิดอ่าน">
  <svg id="heart" viewBox="0 0 32 29"><path fill="#ff3d7f" d="M16 28C-6 13 4-3 16 6 28-3 38 13 16 28z"/></svg>
  <h1>สุขสันต์วันเกิดนะที่รัก</h1>
  <p>แตะเพื่อเปิดอ่าน</p>
</div>
<script>
(function(){
  var MSGS=["สุขสันต์วันเกิดนะน้ำสุดที่รัก","สุขสันต์วันเกิดนะน้ำ","น้ำคือคนสำคัญของเค้า","รักน้ำที่สุดเลย","ขอให้น้ำมีความสุขทุกวัน","ขอบคุณที่น้ำอยู่ข้างกันนะ","อยู่กับเค้าไปนานๆ นะน้ำ","น้ำคือคนที่เค้ารัก","ปีนี้ขอให้ทุกอย่างดีสำหรับน้ำ","ยิ้มของน้ำทำให้เค้าใจฟู","อยากกอดน้ำแน่นๆ","สุขสันต์วันเกิดนะน้ำ","วันเกิดน้ำ วันที่พิเศษที่สุด","น้ำเก่งที่สุดเลย","รักน้ำนะ","ขอให้ทุกพรของน้ำเป็นจริง"];

  var items=[],hearts=[],big=[],i;
  for(i=0;i<95;i++){var wa=rnd(0,Math.PI*2),wr=Math.max(W,H)*2.3;items.push({x:Math.cos(wa)*wr,y:Math.sin(wa)*wr,z:rnd(0,DEPTH),a:rnd(-.28,.28),s:rnd(28,44),m:MSGS[i%MSGS.length],h:rnd(0,360),wave:1,waveStart:i*8.2/95,meteorX:rnd(-W*.48,W*.48),meteorDx:rnd(-150,150)})}
  var gift={x:0,y:-60,z:0,a:-.12,s:170,m:HUGE[0],huge:1,h:300,fi:0};
  for(i=0;i<PH.length;i++){var pa=rnd(0,Math.PI*2),pr=Math.max(W,H)*2.3;items.push({photo:imgs[i],x:rnd(-520,520),y:rnd(-850,850),waveX:Math.cos(pa)*pr,waveY:Math.sin(pa)*pr,photoIndex:i,wavePhoto:1,meteorX:rnd(-W*.48,W*.48),meteorDx:rnd(-170,170),z:(i/PH.length)*DEPTH+rnd(0,200),a:rnd(-.25,.25),w:240})}
  for(i=0;i<46;i++)hearts.push({x:rnd(-900,900),y:rnd(-1300,1300),z:rnd(0,DEPTH),s:rnd(14,34),r:rnd(-.5,.5)});
  for(i=0;i<3;i++)big.push({x:rnd(-420,420),y:rnd(-700,700),z:rnd(0,DEPTH),s:rnd(180,240),r:rnd(-.3,.3),h:rnd(0,360)});
